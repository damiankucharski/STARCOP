# Tversky F0.5-Equivalent Precision Specialist Configuration
# Mathematical equivalence: Tversky(α=0.8, β=0.2) ≡ F0.5
#
# Derivation (see LOSSES.md for full details):
#   F-beta to Tversky mapping: α = 1/(1+β²), β_t = β²/(1+β²)
#   For F0.5: α = 1/(1+0.25) = 0.8, β_t = 0.25/1.25 = 0.2
#
# This creates a precision-focused model that penalizes FP 4× more than FN

experiment_name: "tversky_f05_precision"
seed: 42

resume_from_checkpoint: False

wandb:
  wandb_project: "STARCOP"
  wandb_entity: "phd-dk"
  images_logging: "wandb"

dataloader:
  batch_size: 32
  num_workers: 16

products_plot: ["rgb_aviris", "mag1c", "label", "pred", "differences"]
plot_samples: 8

dataset:
  # Input: mag1c + RGB (HyperSTARCOP configuration)
  input_products:
    ["mag1c", "TOA_AVIRIS_640nm", "TOA_AVIRIS_550nm", "TOA_AVIRIS_460nm"]
  output_products: ["labelbinary"]

  # mag1c weighting (HyperSTARCOP uses mag1c-weighted loss)
  use_weight_loss: True
  weight_loss: "weight_mag1c"

  # Training parameters
  training_size: [128, 128]
  training_size_overlap: [64, 64]
  weight_sampling: True

  # Same datasets as baseline for fair comparison
  root_folder: ${oc.env:STARCOP_DATA_ROOT,/home/s/Data/STARCOP}
  train_csv: "train_without_okapi.csv"
  val_csv: "okapi_fusion.csv"
  test_csv: "test.csv"

model:
  train: True
  test: False

  model_mode: "segmentation_output"
  model_type: "unet_semseg"
  semseg_backbone: "mobilenet_v2"

  num_classes: 1
  optimizer: "adam"

  # Hyperparameters (same as baseline)
  lr: 0.001
  lr_decay: 0.5
  lr_patience: 4

  # TVERSKY LOSS - F0.5 equivalent (precision-focused)
  # α = 1/(1+β²) = 1/1.25 = 0.8 (FP weight)
  # β = β²/(1+β²) = 0.25/1.25 = 0.2 (FN weight)
  # This penalizes false positives 4× more than false negatives
  loss: "tversky"
  tversky_alpha: 0.8
  tversky_beta: 0.2
  tversky_smooth: 1.0

  # Early stopping
  early_stopping_patience: 8

  # Model selection: F0.5 (precision-focused, mathematically aligned with loss)
  selection_metric: val_f05score

training:
  accelerator: gpu
  devices: 1
  max_epochs: 15

  val_check_interval: 0.5
  train_log_every_n_steps: 10

hydra:
  job:
    chdir: True
    config:
      override_dirname:
        exclude_keys:
          - experiment_name
  run:
    dir: experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M}
  sweep:
    dir: experiments
    subdir: ${hydra.job.override_dirname}/${now:%Y-%m-%d_%H-%M}
